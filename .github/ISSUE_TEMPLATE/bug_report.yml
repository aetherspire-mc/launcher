name: Bug report
description: Something in the launcher isn't working the way it should.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please do not use this form for security
        vulnerabilities; use the Security tab's "Report a vulnerability" instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, and what happened instead of what you expected?
      placeholder: |
        1. I clicked Sign in with Microsoft
        2. ...
        3. The launcher showed ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Launcher version
      description: Shown in the launcher's Settings screen, or the installer filename.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >
        Anything relevant from the launcher window's DevTools console
        (Ctrl/Cmd+Shift+I). This will be formatted as code automatically.
      render: shell
